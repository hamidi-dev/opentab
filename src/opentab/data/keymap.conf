# opentab keymap — every key the TUI answers to, remappable.
#
# Edit, save, and it takes effect on the next start — or press K inside opentab
# to open this file in $EDITOR and have it reloaded the moment you return.
#
# One line per action:            action = key, key, key
#   - the FIRST key is what the footer and the ? cheat sheet print
#   - an empty value unbinds:     export =
#   - a missing line (or file) means the built-in default — delete anything
#     you don't want to change, and new opentab releases can add keys without
#     touching this file.
#
# Key syntax (case-sensitive for letters: S is shift-s):
#   j  G  /  $  1  ö            a single character, ASCII or not
#   enter esc space tab shift-tab backspace delete insert up down left
#   right pgup pgdn home end f1..f12   named keys
#   ctrl-u  (or ^u)             control chords (letters only)
#   comma                       a literal "," (the bare comma separates keys)
#
# Contexts: each [section] owns the keyboard while its screen is up. The
# pickers share [menu]; a [menu.xxx] line overrides just that picker. The
# Trends sub-states fall back to [trends], the P model drill to [prices].
#
# Ctrl-C always quits and cannot be rebound. Typos here never break the TUI:
# bad lines fall back to the default and land a warning in the N notices.


# The main views: browse -> zoom -> session. Everything outside an overlay.
[main]
# drill in — a Turns prompt, then one turn's own trace
select = enter
# step back out — session → zoom → browse
back = esc, backspace
# previous turn in this prompt
trace_prev = [
# next turn in this prompt
trace_next = ]
# expand / collapse this turn's content
trace_expand = z
# move / scroll down
down = j, down
# move / scroll up
up = k, up
# half a page down
page_down = pgdn, ctrl-d
# half a page up
page_up = pgup, ctrl-u
# jump to the top
top = g
# jump to the bottom
bottom = G
# previous detail tab
tab_prev = h, left
# next detail tab
tab_next = l, right
# cycle the sidebar panels
cycle_panel = tab
# cycle panels back / step out
cycle_panel_back = shift-tab
# jump to sidebar panel 1
panel_1 = 1
# jump to sidebar panel 2
panel_2 = 2
# jump to sidebar panel 3
panel_3 = 3
# jump to the detail pane
panel_detail = 0
# Time browse mode
mode_time = t
# Projects browse mode
mode_projects = p
# Harnesses browse mode
mode_harnesses = u
# Machines browse mode
mode_machines = m
# maximize / restore the detail pane
maximize = +
# sort this list
sort = s, S
# filter — fuzzy over titles, projects, notes
filter = f, /
# search retained conversation text
conversation_search = ctrl-f
# clear the filter
clear_filter = x
# ignore / unignore the selection
ignore = i
# show ignored rows
show_ignored = I
# bookmark ★ this session
bookmark = b
# show only bookmarked sessions
show_bookmarks = B
# note ✎ this session
note = n
# export this list to CSV
export = e
# open the selection's directory
open_dir = o
# resume this session in its own tool
launch = L
# what-if — reprice a session at one model
whatif = w
# set the date range
range = R
# all time
all_time = a
# reload the data
reload = r
# re-pull machine summaries over ssh (fleet)
refresh_machines = F
# switch harness / filter harness (fleet)
harness = H
# filter every view to one machine (fleet)
machine = M
# colour theme picker
theme = C
# anonymize for a screenshot
demo = D
# scramble prompt text without entering demo
hide_prompts = ctrl-p
# price subscription usage at API list rates
api_prices = $
# trends — charts, calendar heatmap, rankings
trends = T
# model prices overlay
prices = P
# notifications — reread the toasts that faded
notices = N
# what's new in this release
whats_new = W
# the key cheat sheet
help = ?
# edit these bindings in $EDITOR
edit_keymap = K
# quit
quit = q

