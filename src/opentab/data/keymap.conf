# The T overlay: tab strip, bar charts, calendar, ranked rows. Sub-states
# (a focused chart, a drilled row's session list) have their own sections
# below and fall back here for anything they don't name.
[trends]
# previous Trends tab
tab_prev = h, left
# next Trends tab
tab_next = l, right
# focus the chart / drill into a row
select = enter
# page the shown month/week/year · move the row cursor
down = j, down
# page newer · move the row cursor
up = k, up
# page older (alias)
older = [
# page newer (alias)
newer = ]
# more heat shades (Calendar)
shades_more = +, =
# fewer heat shades (Calendar)
shades_less = -, _
# sort a ranked tab (Models/Providers/…)
sort = s, S
# leave the focused chart / drill, else close
back = esc
# close the overlay
close = q, T
# re-price the charts at API list rates
api_prices = $
# the cheat sheet, floating above
help = ?
# search retained conversation text
conversation_search = ctrl-f
# the price table, floating above
prices = P
# colour theme picker
theme = C
# harness picker / fleet filter
harness = H
# machine filter (fleet)
machine = M
# flip demo anonymization in place
demo_toggle = D

# A focused Daily/Weekly/Monthly chart or the Calendar grid (Enter focused it).
[trends.chart]
# walk the bar / day cursor left
cursor_left = left
# walk the bar / day cursor right
cursor_right = right
# cursor up (a day · a week on Daily)
cursor_up = up
# cursor down (a day · a week on Daily)
cursor_down = down
# drill into the highlighted bar / day
select = enter
# unfocus — back to tab navigation
back = esc

# A ranked row's drill (Models: Economics/Sessions; other rows: sessions).
[trends.drill]
# move / scroll down
down = j, down
# move / scroll up
up = k, up
# half a page down
page_down = pgdn, ctrl-d
# half a page up
page_up = pgup, ctrl-u
# jump to the top
top = g
# jump to the bottom
bottom = G
# show Sessions / open the selected session
select = enter
# previous model subtab, else leave the drill, previous tab
tab_prev = h
# next model subtab, else leave the drill, next tab
tab_next = l, right
# back to the ranked rows
back = esc, left, backspace

# The P overlay's model table. The per-model session drill falls back here.
[prices]
# cycle the view: flat · vendor · provider · models.dev
cycle_view = p
# previous view
tab_prev = h, left
# next view
tab_next = l, right
# pin this model ★
pin = space
# move / scroll down
down = j, down
# move / scroll up
up = k, up
# half a page down
page_down = pgdn, ctrl-d
# half a page up
page_up = pgup, ctrl-u
# jump to the top
top = g
# jump to the bottom
bottom = G
# the sessions that used this model
select = enter
# sort the price table
sort = s, S
# filter the model list
filter = f, /
# refresh the rates from models.dev
refresh = r, R
# export the price table to CSV
export = e
# close (from the model list)
back = esc
# close the overlay
close = q, P
# trends, floating above
trends = T
# the cheat sheet, floating above
help = ?
# search retained conversation text
conversation_search = ctrl-f
# colour theme picker
theme = C
# harness picker / fleet filter
harness = H
# machine filter (fleet)
machine = M
# flip demo anonymization in place
demo_toggle = D
# flip the $ what-if pricing behind the table
api_prices = $

# A model's session list inside P (it only scrolls and steps back out).
[prices.sessions]
# move / scroll down
down = j, down
# move / scroll up
up = k, up
# half a page down
page_down = pgdn, ctrl-d
# half a page up
page_up = pgup, ctrl-u
# jump to the top
top = g
# jump to the bottom
bottom = G
# back to the model list
back = esc, left, backspace

# Every small picker shares these: the H harness/source menus, M machines,
# s sort, C themes, D demo, L launch, w what-if. A per-picker section below
# overrides one picker; this section re-teaches all of them at once.
[menu]
# move the highlight down
down = j, down
# move the highlight up
up = k, up
# jump to the first row
first = g
# jump to the last row
last = G
# apply the highlighted row
select = enter
# cancel, change nothing
cancel = esc, backspace, q

# The H data-source picker (off a fleet).
[menu.source]
# H again walks the list
advance = H

# The H harness filter (in a fleet).
[menu.harness]
# H again walks the list
advance = H

# The M machine filter.
[menu.machine]
# M again walks the list
advance = M

# The s sort picker.
[menu.sort]
# s again walks the list
advance = s

# The C theme picker (j/k live-preview; Esc reverts).
[menu.theme]
# C again walks the list
advance = C
# cancel and revert the preview
cancel = esc, q

# The D anonymize picker (a multi-check list).
[menu.demo]
# check / uncheck the category
toggle = space, x
# check all · clear all
check_all = a
# cancel, demo state unchanged
cancel = esc, q, D

# The L launch picker. Each target also answers to its first letter --
# those shortcuts follow the target names and are not remappable.
[menu.launch]
# cancel the launch
cancel = esc, backspace, q

# The w what-if model picker.
[menu.whatif]
# w again walks the list
advance = w
# your models ↔ the catalog
catalog = tab, h, l, left, right
# filter the model list
filter = f, /

# Typing in the what-if picker's filter (printable keys edit the query).
[menu.whatif.filter]
# pick the highlighted model
select = enter
# drop the query, back to the list keys
cancel = esc
# delete the last character
erase = backspace
# clear the query
clear = ctrl-u
# move the highlight down
down = down, ctrl-n
# move the highlight up
up = up, ctrl-p

# Typing in the live / filter line (printable keys edit the query).
[filter]
# keep the filter and leave the line
confirm = enter
# restore the query from before
cancel = esc
# delete the last character
erase = backspace
# clear the query
clear = ctrl-u
# move the selection down, filter stays live
down = down
# move the selection up
up = up

# The one-line prompts: the n note, the R range (printables type).
[input]
# accept the value
confirm = enter
# cancel, keep what was there
cancel = esc
# delete the last character
erase = backspace
# clear the whole line
kill_line = ctrl-u
# delete the last word
kill_word = ctrl-w

# Full-screen retained conversation search and reader.
[search]
# focus the query input
edit = ctrl-f, /
# switch Results / Conversation tabs
prev_tab = h, left
# switch Results / Conversation tabs
next_tab = l, right
# finish editing / move focus to results or preview
focus_next = tab
# finish editing / move focus back
focus_previous = shift-tab
# commit the query / open the selected hit
open = enter
# reader / session scope / overlay back
back = esc
# move or scroll down
down = j, down
# move or scroll up
up = k, up
# scroll the conversation preview without changing focus
preview_down = J
# scroll the conversation preview up without changing focus
preview_up = K
# page down
page_down = pgdn
# page up
page_up = pgup
# search only the selected session
scope_session = s
# search all sessions, keeping other filters
scope_all = a
# choose all sessions or this session
scope_menu = S
# clear every search filter, keeping the query
reset_filters = R
# edit the project scope
scope_project = p
# choose the harness filter
scope_harness = H
# edit UTC message-date bounds
scope_date = d
# explicitly refresh the plaintext index
index = I
# read an earlier window
previous = [
# read a later window
next = ]
# search keys and privacy help
help = ?
# launch / copy the selected session resume command
launch = L

# Conversation query or scope text entry; printable keys are reserved for text.
[search.edit]
# focus results / apply the scope field
open = enter
# focus the query input
edit = ctrl-f
# finish query editing / cancel the scope field
back = esc
# delete the last character
erase = backspace
# clear the text
clear = ctrl-u
# finish editing and focus results
focus_next = tab
# finish editing and focus preview
focus_previous = shift-tab
# move or scroll down
down = down
# move or scroll up
up = up
# page down
page_down = pgdn
# page up
page_up = pgup

# A startup warning about source data that can disappear (other keys are swallowed).
[prompt.warning]
# continue; show again next run
continue = enter, esc
# don't show this warning again
never = d, D

# The one-time 'fetch model prices?' prompt (any other key = not now).
[prompt.prices]
# fetch now
accept = y, Y, enter
# never ask again
never = d, D
# not now, ask next run
decline = n, esc
