# move / scroll up
up = k, up
# half a page down
page_down = pgdn, ctrl-d
# half a page up
page_up = pgup, ctrl-u
# jump to the top
top = g
# jump to the bottom
bottom = G
# the colour picker floats above help
theme = C
# the harness picker floats above help
harness = H
# the machine filter floats above help
machine = M
# the demo picker floats above help
demo = D
# edit these bindings in $EDITOR
edit_keymap = K
# what's new in this release
whats_new = W
# search retained conversation text
conversation_search = ctrl-f
# close the cheat sheet
close = esc, q, ?

# The W release highlights pager.
[whats-new]
# previous release
older = l, right
# next release
newer = h, left
# move / scroll down
down = j, down
# move / scroll up
up = k, up
# half a page down
page_down = pgdn, ctrl-d
# half a page up
page_up = pgup, ctrl-u
# jump to the top
top = g
# jump to the bottom
bottom = G
# open the full GitHub release
open_release = o
# search retained conversation text
conversation_search = ctrl-f
# close the release highlights
close = esc, q, W

# The N notifications scrollback (a pager).
[notices]
# move / scroll down
down = j, down
# move / scroll up
up = k, up
# half a page down
page_down = pgdn, ctrl-d
# half a page up
page_up = pgup, ctrl-u
# jump to the top
top = g
# jump to the bottom
bottom = G
# search retained conversation text
conversation_search = ctrl-f
# close the scrollback
